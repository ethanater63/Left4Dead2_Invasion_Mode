// ===========================================================================
// server.cfg — L4D2 Invasion Mode dedicated server (coop)
// Lives at: /home/steam/l4d2/left4dead2/cfg/server.cfg
//
// NOTE: the l4d2_invasion plugin cvars are NOT set here. They live in
// cfg/sourcemod/l4d2_invasion.cfg, written by the plugin's AutoExecConfig.
// l4dinfectedbots cvars live in cfg/sourcemod/l4dinfectedbots.cfg.
// ===========================================================================

// --- Identity --------------------------------------------------------------
hostname "L4D2 Invasion Mode | Coop + Playable Infected"   // Name shown in the server browser
sv_tags "invasion,coop,sourcemod"                          // Browser search tags

// --- Admin access ----------------------------------------------------------
// CHANGEME: set a long random password before exposing this server.
rcon_password "CHANGEME_rcon_password"                     // Remote console password; empty disables rcon
sv_password ""                                             // Join password; empty = public server

// --- Network / visibility --------------------------------------------------
sv_lan 0                                                   // 0 = internet server (registers with Steam), 1 = LAN only
sv_region 255                                              // 255 = world. 0=US-East 1=US-West 2=South America 3=Europe 4=Asia 5=Australia 6=Middle East 7=Africa
sv_allow_lobby_connect_only 0                              // 0 = players may connect directly by IP (connect <ip>:27015) without a Steam lobby
sv_steamgroup_exclusive 0                                  // 0 = anyone may join, not just a Steam group
sv_visiblemaxplayers 8                                     // Player count advertised in the browser (matches -maxplayers 8 in l4d2.service)

// --- Game mode -------------------------------------------------------------
sv_gametypes "coop"                                        // Game modes this server offers in the lobby/browser
mp_gamemode coop                                           // Active game mode; l4dinfectedbots reads data/l4dinfectedbots/coop.cfg for this mode
z_difficulty Normal                                        // Easy / Normal / Hard / Impossible

// --- Client file validation ------------------------------------------------
// sv_consistency 0 and sv_pure 0 are required-ish for a modded/plugin server:
// they stop clients being kicked over harmless local file differences.
sv_consistency 0                                           // 0 = do not force file consistency checks on clients
sv_pure 0                                                  // 0 = allow client custom content. Set to 1 to enforce pure server file whitelisting (stricter, can cause kicks)
sv_pure_kick_clients 0                                     // 0 = do not kick on pure violations, just log

// --- Timing / stability ----------------------------------------------------
sv_alltalk 1                                               // 1 = survivors and infected share voice chat (invader can taunt)
sv_cheats 0                                                // Keep cheats off in normal play
sv_timeout 65                                              // Seconds before a non-responding client is dropped
sv_maxrate 0                                               // 0 = no artificial bandwidth cap
sv_minrate 100000                                          // Minimum client rate, helps 30-tick smoothness
sv_hibernate_when_empty 0                                  // 0 = keep running when empty so plugins/timers stay live for SourceMod logging

// --- Logging ---------------------------------------------------------------
log on                                                     // Enable server logging to logs/
sv_logbans 1                                               // Log bans
sv_logecho 1                                               // Echo log lines to console
sv_logfile 1                                               // Write a log file
sv_log_onefile 0                                           // New log file per map, not one giant file

// --- Voting ----------------------------------------------------------------
sv_vote_issue_kick_allowed 1                               // Let players vote-kick griefers
sv_vote_issue_changedifficulty_allowed 0                   // Difficulty is fixed by z_difficulty above
sv_vote_issue_restart_game_allowed 0                       // Round restarts would disturb an in-progress invasion

// SourceMod's own configs are exec'd automatically from cfg/sourcemod/ —
// do not exec them here.
