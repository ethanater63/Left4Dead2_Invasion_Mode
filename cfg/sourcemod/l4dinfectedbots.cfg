// ===========================================================================
// l4dinfectedbots.cfg — cvar config for l4dinfectedbots (fbef0102 fork)
// Lives at: /home/steam/l4d2/left4dead2/cfg/sourcemod/l4dinfectedbots.cfg
// (This is the file the plugin's AutoExecConfig writes/reads.)
//
// IMPORTANT — the settings that actually enable a HUMAN on the infected team
// in coop are NOT cvars any more. The current plugin moved them into its
// per-gamemode KeyValues data config:
//     addons/sourcemod/data/l4dinfectedbots/coop.cfg
// See configs/l4dinfectedbots_coop.cfg in this repo for the keys to merge
// into that file (coop_versus_enable, coop_versus_join_access,
// coop_versus_human_limit, coop_versus_tank_playable, ...).
//
// Only the cvars below exist in the current plugin. Every other
// "l4d_infectedbots_*" name found in old forum posts (e.g.
// l4d_infectedbots_coop_versus, l4d_infectedbots_admin_coop_versus,
// l4d_infectedbots_coop_versus_human_limit) has been REMOVED upstream and
// will produce "Unknown command" on the console.
// ===========================================================================

// Master switch for l4dinfectedbots. 1 = plugin active, 0 = disabled.
l4d_infectedbots_allow "1"

// Gamemode whitelist (comma separated, e.g. "coop,realism"). Empty = use the
// l4d_infectedbots_modes_tog bitflag below instead.
l4d_infectedbots_modes ""

// Gamemode blacklist (comma separated). Empty = block nothing.
l4d_infectedbots_modes_off ""

// Gamemode bitflag used when the two lists above are empty.
// 0 = all modes, 1 = Coop/Realism, 2 = Versus/Scavenge, 4 = Survival.
// We run coop only, so 1.
l4d_infectedbots_modes_tog "1"

// Plugin's own "you can join infected" chat spam. 0 = off: l4d2_invasion
// does all invasion announcements itself and we keep chat clean.
l4d_infectedbots_announce_chat "0"

// Print the same announcements to the server console/log. Default 0.
l4d_infectedbots_announce_server "0"

// Infected HUD for players on the infected team (spawn timer, SI alive, etc.).
// Default 1. Left on; l4d2_invasion's lives/time hint is a separate hint box.
l4d_infectedbots_infhud_enable "1"

// Tell joining infected players that the infected HUD exists. Default 1.
l4d_infectedbots_infhud_announce "1"

// Let SURVIVOR bots be replaced/handled in versus-style play. Default 0.
// Unrelated to coop human-infected; leave at default.
l4d_infectedbots_versus_coop "0"

// Gamemode bitflag in which this plugin stands down for sm_zss (Zombie
// Spawning System) compatibility. Default 6 (Versus/Scavenge + Survival),
// which leaves coop to l4dinfectedbots. Leave at default.
l4d_infectedbots_sm_zss_disable_gamemode "6"

// Count dead/ghost special infected when working out how many bots to spawn.
// Default 0. Leave at default — bot spawn behaviour stays stock.
l4d_infectedbots_calculate_including_dead "0"

// Auto-kill infected who hide and never attack ("cowards"). This targets
// infected BOTS, not humans, but we set it to 0 so nothing in this plugin can
// suicide our human invader for playing patiently.
l4d_infectedbots_dispose_cowards "0"

// Force a specific data config file name instead of <gamemode>.cfg from
// addons/sourcemod/data/l4dinfectedbots/. Empty = auto (coop -> coop.cfg),
// which is what we want.
l4d_infectedbots_read_data ""
