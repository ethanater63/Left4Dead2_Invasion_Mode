// ===========================================================================
// l4dinfectedbots coop DATA CONFIG override — MERGE, DO NOT REPLACE
//
// Destination file on the server:
//     /home/steam/l4d2/left4dead2/addons/sourcemod/data/l4dinfectedbots/coop.cfg
//
// This file is NOT a cvar config and NOT a drop-in replacement. The upstream
// coop.cfg shipped with l4dinfectedbots also contains the bot spawn limits,
// special-infected class limits, spawn weights and healths for coop. Those
// MUST be preserved (CLAUDE.md: "Leave bot spawn counts at their defaults").
//
// HOW TO APPLY
//   1. Keep the upstream coop.cfg and its root KeyValues block exactly as it
//      is (do not rename the root key, do not delete other keys).
//   2. For each key listed below, find that key inside the upstream file and
//      change only its VALUE to the value shown here.
//   3. If a key is genuinely absent upstream, add that one line inside the
//      same block the other coop_versus_* keys live in.
//   4. Reload: `sm plugins reload l4dinfectedbots` or restart the server
//      (the data config is read on plugin load / map start, not on cvar set).
//
// deploy/setup_lxc.sh performs step 2 automatically with an idempotent
// in-place edit, backs the original up to coop.cfg.upstream, and prints a
// loud WARNING naming any key it could not find so you can add it by hand
// from this file.
//
// WHY THESE ARE NOT CVARS
// The old cvars named in CLAUDE.md Step 2 no longer exist. Current
// l4dinfectedbots reads these from this data config via
// hData.GetNum("coop_versus_enable", ...) etc. Mapping:
//     l4d_infectedbots_coop_versus              -> coop_versus_enable
//     l4d_infectedbots_admin_coop_versus        -> coop_versus_join_access
//     l4d_infectedbots_coop_versus_human_limit  -> coop_versus_human_limit
//     l4d_infectedbots_coop_versus_tank_playable-> coop_versus_tank_playable
// ===========================================================================

// The keys below belong inside the ROOT KeyValues block of the upstream
// coop.cfg — shown here indented one level for that reason. Keep whatever
// root key name upstream uses; only the key/value lines matter.
{
	// Allow HUMAN players on the infected team in coop. 1 = on.
	// (Old name: l4d_infectedbots_coop_versus)
	"coop_versus_enable"			"1"

	// Admin flag string required to join infected.
	//   ""   = everyone may join  <-- what we want
	//   "z"  = root admin only (UPSTREAM DEFAULT)
	//   "-1" = nobody
	// (Old name: l4d_infectedbots_admin_coop_versus "0")
	"coop_versus_join_access"		""

	// Maximum simultaneous HUMAN infected. 1, matching
	// l4d2_invasion_max_invaders 1.
	// (Old name: l4d_infectedbots_coop_versus_human_limit)
	// Two simultaneous human invaders. This is the l4dinfectedbots half of the
	// cap; l4d2_invasion_max_invaders must match, and the lower of the two wins.
	"coop_versus_human_limit"		"2"

	// May a human play the Tank? 0 = no (CLAUDE.md requirement).
	// (Old name: l4d_infectedbots_coop_versus_tank_playable)
	//
	// Stays 0 here. Tank access is granted for the finale only, by the plugin
	// swapping l4d_infectedbots_read_data over to "coop_finale" - a generated
	// copy of this file whose ONLY difference is this key set to "1".
	// setup_lxc.sh generates coop_finale.cfg and refuses to install it if it
	// differs from coop.cfg by anything else. Do not hand-edit it; change
	// coop.cfg and re-run the setup script.
	"coop_versus_tank_playable"		"0"

	// Human infected respawn delay window, seconds. Both set to 10.0 so it
	// matches l4d2_invasion_respawn 10.0 and the plugin's own
	// L4D_SetPlayerSpawnTime call does not fight a random value.
	// NOTE: l4dinfectedbots clamps this to a 3.0s floor, so values below 3.0
	// are ignored.
	"coop_versus_spawn_time_min"		"10.0"
	"coop_versus_spawn_time_max"		"10.0"

	// l4dinfectedbots' own "you may join infected" announcement. 1 = on
	// (its default). Harmless: chat spam is suppressed separately by
	// l4d_infectedbots_announce_chat "0".
	"coop_versus_announce"			"1"

	// Give the human infected the ghost-ring / outline glow so they can be
	// tracked normally. 1 = on (default).
	"coop_versus_human_light"		"1"

	// Human infected spawn as a ghost first (pick a spawn spot, then
	// materialise) instead of spawning instantly. 1 = on (default) — the
	// invasion timer counts ghost time, per CLAUDE.md.
	"coop_versus_human_ghost"		"1"

	// l4dinfectedbots' OWN rejoin cooldown after leaving the infected team,
	// in seconds. Left at its default 60.0. This is NOT our budget cooldown:
	// l4d2_invasion enforces l4d2_invasion_cooldown 600 on top of it.
	"coop_versus_cool_down"			"60.0"

	// --- DO NOT COPY ANYTHING ELSE ------------------------------------------
	// Every other key in the upstream coop.cfg (bot spawn limits, per-class
	// limits, spawn weights, healths, spawn distances) stays at its upstream
	// default. Do not delete them and do not add them here.
}
